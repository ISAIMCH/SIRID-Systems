<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Project-GymGo: Ecosistema digital y hardware IoT para gimnasios.">
    <title>Project-GymGo | Premium SaaS</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Estilos personalizados (Estética Apple/Samsung) -->
    <style>
        /* Importar fuente limpia y moderna similar a San Francisco / Roboto */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f5f5f7; /* Gris muy claro, típico de fondos minimalistas */
            padding-top: 60px;
        }

        /* Efecto de Cristal Esmerilado (Glassmorphism) */
        .navbar-premium {
            background-color: rgba(22, 22, 23, 0.8) !important; /* Negro translúcido */
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s ease;
        }

        .navbar-brand {
            font-weight: 600;
            letter-spacing: -0.5px;
            color: #ffffff !important;
            font-size: 1.2rem;
        }

        .nav-link {
            color: #d2d2d7 !important; /* Gris claro sutil */
            font-size: 0.85rem;
            font-weight: 400;
            letter-spacing: 0.3px;
            margin: 0 10px;
            transition: color 0.2s ease;
        }

        .nav-link:hover {
            color: #ffffff !important; /* Brillo al pasar el mouse */
        }

        /* Botón estilo Apple: Pequeño, bordes muy redondeados, alto contraste */
        .btn-demo {
            background-color: #ffffff;
            color: #1d1d1f;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 20px;
            padding: 6px 16px;
            border: none;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .btn-demo:hover {
            opacity: 0.9;
            transform: scale(1.02);
            color: #1d1d1f;
        }

        /* Ajuste del botón hamburguesa para que sea visible en fondo oscuro */
        .navbar-toggler {
            border: none;
        }
        .navbar-toggler-icon {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba%28255, 255, 255, 0.8%29' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
        }
    </style>
</head>
<body>

    <!-- MENÚ PREMIUM -->
    <nav class="navbar navbar-expand-lg navbar-premium fixed-top py-2">
        <div class="container">
            <a class="navbar-brand" href="index.html">Project-GymGo</a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navPremium">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse justify-content-end" id="navPremium">
                <ul class="navbar-nav align-items-center">
                    <li class="nav-item">
                        <a class="nav-link" href="pages/soluciones.html">Software</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="pages/hardware.html">Hardware IoT</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="pages/precios.html">Precios</a>
                    </li>
                    <li class="nav-item ms-lg-3 mt-3 mt-lg-0">
                        <a class="nav-link text-white opacity-75" href="pages/login.html">Iniciar Sesión</a>
                    </li>
                    <li class="nav-item ms-lg-3 mt-3 mt-lg-0">
                        <a class="btn btn-demo" href="pages/demo.html">Agendar Demo</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenido temporal -->
    <main class="container mt-5 pt-5">
        <div class="row justify-content-center text-center">
            <div class="col-md-8">
                <h1 class="fw-bold" style="letter-spacing: -1px; color: #1d1d1f; font-size: 3rem;">El ecosistema para tu gimnasio.</h1>
                <p class="text-muted mt-3 fs-5">El slider y el contenido principal irán aquí.</p>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
