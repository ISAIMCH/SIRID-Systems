<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Project-GymGo</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/estilos.css">

</head>
<body class="auth-page">

    <!-- Navegación Premium -->
    <nav class="navbar navbar-premium fixed-top py-3">
        <div class="container justify-content-center">
            <a class="navbar-brand fs-4 m-0" href="../index.html">
                Project-GymGo
            </a>
        </div>
    </nav>

    <!-- Contenedor Principal del Login -->
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh; padding-top: 60px;">
        <div class="col-12 col-md-8 col-lg-5 col-xl-4">
            
            <div class="login-card">
                <div class="text-center mb-4">
                    <h2 class="login-title mb-2">Iniciar Sesión</h2>
                    <!-- Texto de apoyo enfocado al modelo B2B -->
                    <!-- <p class="text-secondary small">Accede al panel de control y estadísticas de tu gimnasio.</p> -->
                </div>

                <form id="loginForm">
                    <!-- Input Email -->
                    <div class="mb-3">
                        <label for="email" class="form-label">Correo Electrónico</label>
                        <input type="email" class="form-control form-control-premium" id="email" placeholder="admin@tugimnasio.com" required>
                    </div>

                    <!-- Input Contraseña -->
                    <div class="mb-4">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label for="password" class="form-label mb-0">Contraseña</label>
                            <a href="#forgotPasswordModal" class="small link-premium" data-bs-toggle="modal">¿La olvidaste?</a>
                        </div>
                        <input type="password" class="form-control form-control-premium" id="password" placeholder="••••••••" required>
                    </div>

                    <!-- Botón Ingresar -->
                    <button type="submit" class="btn btn-premium w-100 mb-4">Iniciar sesión</button>

                    <div class="text-center mb-4">
                        <div id="g_id_onload"
                            data-client_id="342051956504-6lhed41n2j0g8740nmg4j51fcmsurelp.apps.googleusercontent.com"
                            data-callback="handleGoogleCredential"
                            data-auto_prompt="false">
                        </div>
                        <div class="g_id_signin" data-type="standard" data-size="large" data-width="370"></div>
                    </div>
                    
                    <!-- Redirección a Registro -->
                    <div class="text-center border-top pt-4">
                        <p class="small text-secondary mb-0">¿Aún no tienes cuenta? <br> 
                        <a href="registro.html" class="link-premium fw-semibold">Crear cuenta</a></p>
                    </div>
                </form>
            </div>
            
        </div>
    </div>

    <div class="modal fade" id="forgotPasswordModal" tabindex="-1" aria-labelledby="forgotPasswordTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content auth-modal">
                <div class="modal-header border-0">
                    <h2 class="modal-title h5" id="forgotPasswordTitle">Restablece tu contraseña</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <form id="forgotPasswordForm">
                    <div class="modal-body pt-0">
                        <p class="small text-secondary">Escribe tu correo y te enviaremos un enlace para crear una contraseña nueva.</p>
                        <label for="forgotEmail" class="form-label">Correo electrónico</label>
                        <input id="forgotEmail" class="form-control form-control-premium" type="email" autocomplete="email" required>
                        <div id="forgotPasswordStatus" class="small mt-3" aria-live="polite"></div>
                    </div>
                    <div class="modal-footer border-0">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-premium">Enviar enlace</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Script de conexión al backend para enviar credenciales -->
    <script src="../assets/js/login.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>

</body>
</html>
