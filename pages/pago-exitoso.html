<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<meta name="robots" content="noindex">
<title>Pago recibido | GymGo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<body class="payments-page">
<nav class="site-nav nav-g" aria-label="Navegación">
  <div class="container">
    <a class="brand brand-link" href="../index.html" aria-label="GymGo, inicio"><span class="brand-mark" aria-hidden="true">G</span><span>GYMGO</span></a>
  </div>
</nav>

<main class="container checkout-shell">
  <ol class="checkout-steps justify-content-center" aria-label="Pasos de compra">
    <li class="done"><span>1</span>Cuenta</li>
    <li class="done"><span>2</span>Pago</li>
    <li class="current"><span>3</span>Listo</li>
  </ol>

  <section class="panel result-card" aria-live="polite">
    <div id="result">
      <span class="result-icon wait"><span class="spinner-border" aria-hidden="true"></span></span>
      <h1>Confirmando tu pago…</h1>
      <p>Estamos esperando la confirmación del banco. Esto tarda unos segundos; no cierres esta página.</p>
    </div>
  </section>
</main>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/analytics.js"></script>
<script src="../assets/js/gymgo.js"></script>
<script src="../assets/js/pago-exitoso.js"></script>
</body>
