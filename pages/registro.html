<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta - Project-GymGo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/estilos.css">
    
</head>
<body class="auth-page">

    <nav class="navbar navbar-expand-lg navbar-premium py-2">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand m-0" href="../index.html">Project-GymGo</a>
            <a class="auth-back-link" href="../index.html"><i class="bi bi-arrow-left me-1"></i>Volver al inicio</a>
        </div>
    </nav>

    <main class="container auth-shell d-flex justify-content-center align-items-center">
        <div class="col-12 col-md-8 col-lg-6 col-xl-5">
            <div class="auth-card p-4 p-md-5">
                <div class="text-center mb-4">
                    <!-- <span class="eyebrow">COMIENZA HOY</span> -->
                    <h1 class="auth-title">Crea tu cuenta</h1>
                    <p class="auth-subtitle">Accede al ecosistema digital de tu gimnasio.</p>
                </div>

                <form id="registroForm">

                    <div class="mb-3">
                        <label for="regEmail" class="auth-label">Correo electrónico</label>
                        <input type="email" class="form-control auth-input" id="regEmail" placeholder="nombre@ejemplo.com" maxlength="254" autocomplete="email" required>
                    </div>

                    <div class="mb-3">
                        <label for="regPassword" class="auth-label">Contraseña</label>
                        <input type="password" class="form-control auth-input" id="regPassword" autocomplete="new-password" minlength="8" maxlength="64" required>
                        <div class="password-meter" id="passwordMeter" aria-hidden="true">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                        <div class="password-status" id="passwordStatus" aria-live="polite">Usa entre 8 y 64 caracteres.</div>
                    </div>

                    <div class="mb-4">
                        <label for="regPasswordConfirm" class="auth-label">Confirmar contraseña</label>
                        <input type="password" class="form-control auth-input" id="regPasswordConfirm" autocomplete="new-password" maxlength="64" required>
                        <div class="password-status" id="confirmStatus" aria-live="polite"></div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="regNombre" class="auth-label">Nombre(s)</label>
                            <input type="text" class="form-control auth-input" id="regNombre" autocomplete="given-name" required>
                        </div>
                        <div class="col-md-6 mt-3 mt-md-0">
                            <label for="regApellidos" class="auth-label">Apellidos</label>
                            <input type="text" class="form-control auth-input" id="regApellidos" autocomplete="family-name" required>
                        </div>
                    </div>

                    <fieldset class="mb-3 border-0 p-0">
                        <legend class="auth-label">Fecha de nacimiento</legend>
                        <div class="row gx-2 birth-date-group">
                            <div class="col-4">
                                <label for="regDiaNac" class="visually-hidden">Día</label>
                                <input type="text" class="form-control auth-input" id="regDiaNac" placeholder="Día" inputmode="numeric" pattern="[0-9]{1,2}" maxlength="2" aria-label="Día de nacimiento" required>
                            </div>
                            <div class="col-4">
                                <label for="regMesNac" class="visually-hidden">Mes</label>
                                <select class="form-select auth-input" id="regMesNac" aria-label="Mes de nacimiento" required>
                                    <option value="">Mes</option>
                                    <option value="01">Enero</option>
                                    <option value="02">Febrero</option>
                                    <option value="03">Marzo</option>
                                    <option value="04">Abril</option>
                                    <option value="05">Mayo</option>
                                    <option value="06">Junio</option>
                                    <option value="07">Julio</option>
                                    <option value="08">Agosto</option>
                                    <option value="09">Septiembre</option>
                                    <option value="10">Octubre</option>
                                    <option value="11">Noviembre</option>
                                    <option value="12">Diciembre</option>
                                </select>
                            </div>
                            <div class="col-4">
                                <label for="regAnioNac" class="visually-hidden">Año</label>
                                <input type="text" class="form-control auth-input" id="regAnioNac" placeholder="Año" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" aria-label="Año de nacimiento" required>
                            </div>
                        </div>
                        <div class="invalid-feedback d-block" id="birthDateStatus" aria-live="polite"></div>
                    </fieldset>

                    <div class="form-check terms-consent mb-4">
                        <input class="form-check-input" type="checkbox" id="acceptTerms" required>
                        <label class="form-check-label" for="acceptTerms">
                            Acepto los <a href="terminos.html">términos y condiciones</a>.
                        </label>
                    </div>

                    <button type="submit" class="btn auth-submit w-100 py-2 mb-3">Crear cuenta</button>
                    
                    <div class="text-center">
                        <p class="auth-footer mb-0">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="../assets/js/registro.js"></script>
</body>
</html>
