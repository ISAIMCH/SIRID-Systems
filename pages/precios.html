        .nav-link { color: #d2d2d7 !important; font-size: 0.85rem; font-weight: 400; margin: 0 10px; transition: color 0.2s ease; }

        /* ESTILOS DE LAS TARJETAS DINÁMICAS */

            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);

        }

        .feature-list { list-style: none; padding: 0; margin-top: 30px; }
        .feature-list li { margin-bottom: 15px; font-size: 0.95rem; color: #515154; display: flex; align-items: center; }
        .feature-list li::before { content: "✓"; color: #1d1d1f; font-weight: bold; margin-right: 10px; }
        .btn-buy { background-color: #1d1d1f; color: #ffffff; border-radius: 20px; padding: 10px 24px; font-weight: 600; width: 100%; border: none; margin-top: 20px; display: block; text-align: center; text-decoration: none;}
        .btn-buy:hover { background-color: #333336; color: #ffffff; }

        /* ESTILOS DE LAS TARJETAS DE PRECIOS */
        .pricing-card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            transition: transform 0.3s ease;
            padding: 40px 30px;
            height: 100%;
            position: relative;
        }
        .pricing-card:hover { transform: translateY(-5px); }
        .pricing-card.destacado { border: 2px solid #1d1d1f; }
        .badge-popular {
            position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
            background: #1d1d1f; color: #ffffff; padding: 4px 16px; border-radius: 20px;
            font-size: 0.75rem; font-weight: 600;
        }
        .price-text { font-size: 3.5rem; font-weight: 700; letter-spacing: -1.5px; }
        .feature-list { list-style: none; padding: 0; margin-top: 30px; text-align: left; }
        .feature-list li { margin-bottom: 15px; font-size: 0.95rem; color: #515154; display: flex; align-items: center; }
        .feature-list li::before { content: "✓"; color: #1d1d1f; font-weight: bold; margin-right: 10px; }
        .btn-buy { background-color: #1d1d1f; color: #ffffff; border-radius: 20px; padding: 10px 24px; font-weight: 600; width: 100%; border: none; margin-top: 20px; display: block; text-align: center; text-decoration: none;}
        .btn-buy:hover { background-color: #333336; color: #ffffff; }

    </style>
</head>
<body>

    <!-- MENÚ PREMIUM (Rutas ajustadas para la carpeta pages/) -->
    <nav class="navbar navbar-expand-lg navbar-premium fixed-top py-2">
        <div class="container">
            <a class="navbar-brand" href="../index.html">Project-GymGo</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navPremium">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navPremium">
                <ul class="navbar-nav align-items-center">
                    <li class="nav-item"><a class="nav-link" href="soluciones.html">Software</a></li>
                    <li class="nav-item"><a class="nav-link" href="hardware.html">Hardware IoT</a></li>
                    <li class="nav-item"><a class="nav-link" href="precios.html">Precios</a></li>
                    <li class="nav-item ms-lg-3 mt-3 mt-lg-0">
                        <a class="nav-link text-white opacity-75" href="login.html">Iniciar Sesión</a>
                    </li>
                    <li class="nav-item ms-lg-3 mt-3 mt-lg-0">
                        <a class="btn btn-demo" href="demo.html">Agendar Demo</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- CONTENIDO DE PRECIOS -->
    <div class="container py-5">
        <div class="text-center mb-5">
            <h1 class="fw-bold" style="letter-spacing: -1px;">Elige el plan para tu gimnasio.</h1>
            <p class="text-muted fs-5">Tarifas claras cargadas en tiempo real desde la nube.</p>
        </div>

        <!-- Contenedor donde JavaScript inyectará los datos de MongoDB -->
        <div id="contenedor-planes" class="row g-4 justify-content-center">
            <!-- Spinner de carga temporal -->
            <div class="col-12 text-center">
                <div class="spinner-border text-dark" role="status">
                    <span class="visually-hidden">Cargando planes...</span>
                </div>
            </div>
        </div>
    </div>

    <!-- LÓGICA DE CONEXIÓN A LA BASE DE DATOS (Fetch API) -->
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const contenedor = document.getElementById('contenedor-planes');

            try {
                // Hacemos la petición a tu servidor Node.js
                const respuesta = await fetch('http://localhost:3000/api/planes');
                const planes = await respuesta.json();
                
                contenedor.innerHTML = ''; // Limpiamos el spinner

                if (planes.length === 0) {
                    contenedor.innerHTML = '<p class="text-center text-muted">Aún no hay planes configurados en la base de datos.</p>';
                    return;
                }

                // Generamos una tarjeta HTML por cada plan que venga de MongoDB
                planes.forEach(plan => {
                    const destacadoClass = plan.destacado ? 'destacado' : '';
                    const badgeHtml = plan.destacado ? `<span class="badge-popular">MÁS ELEGIDO</span>` : '';
                    
                    // Convertimos el arreglo de características en etiquetas <li>
                    const listaCaracteristicas = plan.caracteristicas.map(c => `<li>${c}</li>`).join('');

                    const tarjetaHtml = `
                        <div class="col-lg-4 col-md-6">
                            <div class="pricing-card ${destacadoClass}">
                                ${badgeHtml}
                                <h3 class="fw-semibold">${plan.nombre}</h3>
                                <p class="text-muted small">${plan.descripcion}</p>
                                <div class="mt-4">
                                    <span class="price-text">$${plan.precio}</span><span class="text-muted">${plan.tipoCobro}</span>
                                </div>
                                <ul class="feature-list">
                                    ${listaCaracteristicas}
                                </ul>
                                <a href="demo.html" class="btn btn-buy">Agendar Demo</a>
                            </div>
                        </div>
                    `;
                    contenedor.innerHTML += tarjetaHtml;
                });

            } catch (error) {
                console.error("Error conectando al backend:", error);
                contenedor.innerHTML = '<p class="text-center text-danger">Error al cargar los planes desde el servidor.</p>';
            }
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
