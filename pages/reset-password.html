<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer contraseña | Project-GymGo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/estilos.css">
</head>
<body class="auth-page">
    <nav class="navbar navbar-premium py-3">
        <div class="container justify-content-center"><a class="navbar-brand" href="../index.html">Project-GymGo</a></div>
    </nav>
    <main class="container auth-shell d-flex justify-content-center align-items-center">
        <div class="col-12 col-md-7 col-lg-5">
            <section class="auth-card p-4 p-md-5">
                <div class="text-center mb-4"><i class="bi bi-shield-lock fs-1 text-primary"></i><h1 class="auth-title mt-3">Crea una contraseña nueva</h1><p class="auth-subtitle">Protege tu acceso al ecosistema GymGo.</p></div>
                <form id="resetPasswordForm">
                    <div class="mb-3"><label for="newPassword" class="auth-label">Nueva contraseña</label><input id="newPassword" class="form-control auth-input" type="password" minlength="8" maxlength="64" autocomplete="new-password" required><div class="password-status">Usa entre 8 y 64 caracteres.</div></div>
                    <div class="mb-4"><label for="confirmPassword" class="auth-label">Confirmar contraseña</label><input id="confirmPassword" class="form-control auth-input" type="password" minlength="8" maxlength="64" autocomplete="new-password" required></div>
                    <div id="resetStatus" class="small mb-3" aria-live="polite"></div>
                    <button id="resetSubmit" type="submit" class="btn auth-submit w-100">Actualizar contraseña</button>
                </form>
                <div class="text-center mt-4"><a class="link-premium" href="login.html">Volver al inicio de sesión</a></div>
            </section>
        </div>
    </main>
    <script src="../assets/js/reset-password.js"></script>
</body>
</html>
